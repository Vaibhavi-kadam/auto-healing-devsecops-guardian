name: Guardian CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Flask
        run: pip install flask
      - name: Check Code
        run: python -m py_compile backend/app.py
      - name: Test Health Check
        run: echo "Guardian CI Passed!"