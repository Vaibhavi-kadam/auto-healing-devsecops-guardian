<!DOCTYPE html>
<html>
<head>
<title>Auto-Healing Guardian</title>
<style>
body { font-family: Arial; background: #0f172a; color: white; text-align: center; padding: 20px; }
.card { background: #1e293b; padding: 20px; margin: 15px auto; border-radius: 15px; max-width: 500px; }
.score { font-size: 60px; color: #22c55e; font-weight: bold; }
button { padding: 12px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; margin: 5px; }
.green { background: #22c55e; color: white; }
.red { background: #ef4444; color: white; }
.blue { background: #3b82f6; color: white; }
</style>
</head>
<body>
<h1>🛡️ Auto-Healing DevSecOps Guardian</h1>
<p>By Vaibhavi Kadam</p>

<div class="card">
<h2>System Health</h2>
<h1 id="status">Loading...</h1>
<p id="uptime">Uptime: --</p>
</div>

<div class="card">
<h2>Security Compliance Score</h2>
<div class="score" id="score">92</div>
<p>Grade: A | <span id="vuln">1 High Vulnerability Open</span></p>
</div>

<div class="card">
<button class="red" onclick="callAPI('/simulate-failure')">Simulate Failure 💥</button>
<button class="green" onclick="callAPI('/heal')">Heal Now ✨</button>
<button class="blue" onclick="loadData()">Refresh 🔄</button>
</div>

<p id="msg"></p>

<script>
async function loadData(){
  let res = await fetch('/health');
  let data = await res.json();
  document.getElementById('status').innerText = data.status;
  document.getElementById('status').style.color = data.status === 'Running' ? '#22c55e' : '#ef4444';
  document.getElementById('uptime').innerText = 'Uptime: ' + data.uptime;
  let res2 = await fetch('/security');
  let sec = await res2.json();
  document.getElementById('score').innerText = sec.compliance_score;
}
async function callAPI(url){
  let res = await fetch(url);
  let data = await res.json();
  document.getElementById('msg').innerText = data.message || 'Done!';
  loadData();
}
loadData();
</script>
</body>
</html>
